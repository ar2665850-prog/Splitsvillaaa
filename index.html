<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Web Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #1e3c72;
            margin-top: 0;
        }
        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }
        .contact-box {
            background-color: #f0f4f8;
            border-radius: 8px;
            padding: 15px;
            margin: 25px 0;
            font-size: 18px;
            font-weight: bold;
            color: #1e3c72;
            border: 1px dashed #2a5298;
        }
        .status {
            color: #2e7d32;
            font-weight: bold;
            background: #e8f5e9;
            padding: 6px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Site</h1>
        <p>This is a completely custom and unique version of the webpage, updated and fully verified.</p>
        
        <div class="contact-box">
            📞 Call / Contact: +91 7821916233
        </div>

        <p class="status">● System Status: Active</p>
    </div>

</body>
</html>
